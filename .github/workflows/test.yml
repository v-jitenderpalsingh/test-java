name: FB-1625652 bounded setup-java differential

on:
  issues:
    types: [opened]

permissions:
  contents: read

jobs:
  control:
    if: >-
      github.event.issue.user.login == 'v-mahabaleshwars' &&
      github.event.issue.title == 'FB-1625652 bounded setup-java differential' &&
      github.event.issue.body == fromJSON('"X64<<A\nBASE\nA\nFB1625652_CANARY<<B\nCANARYVALUE\nB\nFB1625652_INTENDED"')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact bounded issue body
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          actual="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          test "$actual" = '518eae941ff6ebd204dc7c6b39dec57ea3a68dd62779636b94d00c1bd7e7caeb'
          printf '%s\n' 'EXACT_BODY_GUARD_OK=1'

      - name: Create inert local-JDK fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake-jdk"
          printf '%s\n' \
            'JAVA_VERSION="17.0.1"' \
            'JAVA_RUNTIME_VERSION="17.0.1+1"' \
            > "$RUNNER_TEMP/fake-jdk/release"
          tar -C "$RUNNER_TEMP" \
            -czf "$RUNNER_TEMP/fake-jdk.tar.gz" fake-jdk
          printf '%s\n' 'FIXTURE_READY=1'

      - name: Ordinary architecture control
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: jdkfile
          java-version: '17.0.1'
          jdk-file: ${{ runner.temp }}/fake-jdk.tar.gz
          architecture: x64
          set-default: false
          cache-jdk: false
          force-download: true
          verify-signature: false

      - name: Assert ordinary control
        shell: bash
        run: |
          set -euo pipefail
          test -n "${JAVA_HOME_17_X64-}"
          test -z "${FB1625652_CANARY-}"
          test -z "${FB1625652_INTENDED-}"
          printf '%s\n' 'CONTROL_BASELINE_OK=1'

  candidate:
    if: >-
      github.event.issue.user.login == 'v-mahabaleshwars' &&
      github.event.issue.title == 'FB-1625652 bounded setup-java differential' &&
      github.event.issue.body == fromJSON('"X64<<A\nBASE\nA\nFB1625652_CANARY<<B\nCANARYVALUE\nB\nFB1625652_INTENDED"')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact bounded issue body
        shell: bash
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail
          actual="$(printf '%s' "$ISSUE_BODY" | sha256sum | cut -d' ' -f1)"
          test "$actual" = '518eae941ff6ebd204dc7c6b39dec57ea3a68dd62779636b94d00c1bd7e7caeb'
          printf '%s\n' 'EXACT_BODY_GUARD_OK=1'

      - name: Create inert local-JDK fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fake-jdk"
          printf '%s\n' \
            'JAVA_VERSION="17.0.1"' \
            'JAVA_RUNTIME_VERSION="17.0.1+1"' \
            > "$RUNNER_TEMP/fake-jdk/release"
          tar -C "$RUNNER_TEMP" \
            -czf "$RUNNER_TEMP/fake-jdk.tar.gz" fake-jdk
          printf '%s\n' 'FIXTURE_READY=1'

      - name: Candidate architecture from issue body
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: jdkfile
          java-version: '17.0.1'
          jdk-file: ${{ runner.temp }}/fake-jdk.tar.gz
          architecture: ${{ github.event.issue.body }}
          set-default: false
          cache-jdk: false
          force-download: true
          verify-signature: false

      - name: Assert framed records
        shell: bash
        run: |
          set -euo pipefail
          test "${JAVA_HOME_17_X64-}" = 'BASE'
          test "${FB1625652_CANARY-}" = 'CANARYVALUE'
          test -n "${FB1625652_INTENDED-}"
          printf '%s\n' 'CANDIDATE_BYPASS_OBSERVED=1'

  clean_job_absence:
    needs: [control, candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Assert injected records did not cross jobs
        shell: bash
        run: |
          set -euo pipefail
          test -z "${FB1625652_CANARY-}"
          test -z "${FB1625652_INTENDED-}"
          printf '%s\n' 'CLEAN_JOB_ABSENCE_OK=1'